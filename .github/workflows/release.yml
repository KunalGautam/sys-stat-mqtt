name: Release Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'

      - name: Run Build Script
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/sys-stat-mqtt-linux-amd64
            dist/sys-stat-mqtt-linux-arm64
            dist/sys-stat-mqtt-linux-386
            dist/sys-stat-mqtt-linux-arm
            dist/sys-stat-mqtt-darwin-amd64
            dist/sys-stat-mqtt-darwin-arm64
            dist/sys-stat-mqtt-windows-386.exe
            dist/sys-stat-mqtt-windows-amd64.exe
            dist/sys-stat-mqtt-windows-arm64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
